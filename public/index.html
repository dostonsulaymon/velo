<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Velo — Issue Tracking & Workspace</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="workspace-switcher">
        <div class="workspace-avatar">V</div>
        <div class="workspace-info">
          <span class="workspace-name">Doston Sulaymon</span>
          <span class="workspace-role">Lead Engineer • Tashkent</span>
        </div>
      </div>

      <div class="sidebar-nav">
        <div class="nav-section-title">Views</div>
        <button class="nav-item active" data-view-filter="all">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          <span>All Issues</span>
          <span class="nav-count" id="count-all">0</span>
        </button>
        <button class="nav-item" data-view-filter="active">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          <span>Active Sprint</span>
          <span class="nav-count" id="count-active">0</span>
        </button>
        <button class="nav-item" data-view-filter="backlog">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
          <span>Backlog</span>
          <span class="nav-count" id="count-backlog">0</span>
        </button>
        <button class="nav-item" data-view-filter="done">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          <span>Completed</span>
          <span class="nav-count" id="count-done">0</span>
        </button>

        <div class="nav-section-title" style="margin-top: 1rem;">Projects</div>
        <div id="sidebar-projects-list">
          <!-- Dynamically populated -->
        </div>
      </div>

      <div class="sidebar-footer">
        <div style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.75rem; color: var(--text-muted);">
          <span>Command Menu</span>
        </div>
        <span class="shortcut-hint">⌘K</span>
      </div>
    </aside>

    <!-- Main Workspace -->
    <main class="main-content">

      <!-- Top Header -->
      <header class="top-header">
        <div class="header-left">
          <span class="view-title" id="current-view-title">All Issues</span>
          
          <div class="view-toggle">
            <button class="toggle-btn active" id="btn-toggle-list" title="List View">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
              <span>List</span>
            </button>
            <button class="toggle-btn" id="btn-toggle-board" title="Board View">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="18" rx="1"/></svg>
              <span>Board</span>
            </button>
          </div>
        </div>

        <div class="header-right">
          <!-- Search -->
          <div class="search-bar">
            <input type="text" id="global-search" class="search-input" placeholder="Filter issues...">
            <span class="search-shortcut">/</span>
          </div>

          <!-- Export -->
          <button class="btn-secondary" id="btn-export-csv" title="Export issues to CSV">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span>Export</span>
          </button>

          <!-- Create Issue -->
          <button class="btn-primary" id="btn-open-create-modal">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>New Issue</span>
            <span class="shortcut-hint" style="background: rgba(255,255,255,0.2); color: #fff; margin-left: 0.25rem;">C</span>
          </button>
        </div>
      </header>

      <!-- Filter Strip -->
      <div class="filter-strip">
        <span>Filters:</span>
        <select id="filter-status" class="filter-select">
          <option value="all">Status: All</option>
          <option value="backlog">Backlog</option>
          <option value="todo">Todo</option>
          <option value="in_progress">In Progress</option>
          <option value="done">Done</option>
        </select>
        <select id="filter-priority" class="filter-select">
          <option value="all">Priority: All</option>
          <option value="urgent">Urgent</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
        <select id="filter-project" class="filter-select">
          <option value="all">Project: All</option>
        </select>
        <span id="filtered-count" style="margin-left: auto; font-size: 0.75rem; color: var(--text-muted);">Showing 0 issues</span>
      </div>

      <!-- Main Workspace Views Container -->
      <div class="view-container">

        <!-- 1. List View -->
        <div id="view-list" class="issues-list">
          <!-- Rows rendered by JS -->
        </div>

        <!-- 2. Kanban Board View (Hidden by default) -->
        <div id="view-board" class="kanban-board" style="display: none;">
          <!-- Column: Backlog -->
          <div class="kanban-column" data-col-status="backlog">
            <div class="column-header">
              <div class="column-title-wrap">
                <span class="status-dot" style="background: var(--status-backlog);"></span>
                <span class="column-title">Backlog</span>
              </div>
              <span class="column-count" id="count-col-backlog">0</span>
            </div>
            <div class="column-body" id="col-backlog" ondragover="event.preventDefault()"></div>
          </div>

          <!-- Column: Todo -->
          <div class="kanban-column" data-col-status="todo">
            <div class="column-header">
              <div class="column-title-wrap">
                <span class="status-dot" style="background: var(--status-todo);"></span>
                <span class="column-title">Todo</span>
              </div>
              <span class="column-count" id="count-col-todo">0</span>
            </div>
            <div class="column-body" id="col-todo" ondragover="event.preventDefault()"></div>
          </div>

          <!-- Column: In Progress -->
          <div class="kanban-column" data-col-status="in_progress">
            <div class="column-header">
              <div class="column-title-wrap">
                <span class="status-dot" style="background: var(--status-inprogress);"></span>
                <span class="column-title">In Progress</span>
              </div>
              <span class="column-count" id="count-col-in_progress">0</span>
            </div>
            <div class="column-body" id="col-in_progress" ondragover="event.preventDefault()"></div>
          </div>

          <!-- Column: Done -->
          <div class="kanban-column" data-col-status="done">
            <div class="column-header">
              <div class="column-title-wrap">
                <span class="status-dot" style="background: var(--status-done);"></span>
                <span class="column-title">Done</span>
              </div>
              <span class="column-count" id="count-col-done">0</span>
            </div>
            <div class="column-body" id="col-done" ondragover="event.preventDefault()"></div>
          </div>
        </div>

      </div>

    </main>

  </div>

  <!-- CREATE ISSUE MODAL -->
  <div class="modal-backdrop" id="modal-create-issue">
    <div class="modal-dialog">
      <div class="modal-header">
        <span class="modal-title">New Issue</span>
        <button class="btn-secondary" id="btn-close-create-modal" style="padding: 0.2rem 0.5rem;">✕</button>
      </div>
      <form id="form-create-issue">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">Issue Title</label>
            <input type="text" id="create-title" class="form-input" placeholder="Issue title..." required autofocus>
          </div>
          <div class="form-group">
            <label class="form-label">Description (Markdown)</label>
            <textarea id="create-description" class="form-textarea" rows="4" placeholder="Add context, acceptance criteria, or repro steps..."></textarea>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.75rem;">
            <div class="form-group">
              <label class="form-label">Status</label>
              <select id="create-status" class="filter-select" style="width: 100%;">
                <option value="todo">Todo</option>
                <option value="in_progress">In Progress</option>
                <option value="backlog">Backlog</option>
                <option value="done">Done</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Priority</label>
              <select id="create-priority" class="filter-select" style="width: 100%;">
                <option value="medium">Medium</option>
                <option value="urgent">Urgent</option>
                <option value="high">High</option>
                <option value="low">Low</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Project</label>
              <select id="create-project" class="filter-select" style="width: 100%;">
                <!-- Populated dynamically -->
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary" id="btn-cancel-create">Cancel</button>
          <button type="submit" class="btn-primary">Create Issue</button>
        </div>
      </form>
    </div>
  </div>

  <!-- COMMAND PALETTE MODAL (Cmd + K) -->
  <div class="modal-backdrop" id="modal-command-palette">
    <div class="modal-dialog command-dialog">
      <div class="command-search-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 0.75rem; color: var(--text-muted);"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="command-search-input" class="command-input" placeholder="Type a command or search issues...">
        <span class="shortcut-hint">ESC</span>
      </div>
      <div class="command-list" id="command-results-list">
        <!-- Rendered by JS -->
      </div>
    </div>
  </div>

  <!-- ISSUE DETAIL SLIDE-OVER DRAWER -->
  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <div class="drawer" id="issue-detail-drawer">
    <div class="drawer-header">
      <span style="font-family: var(--font-mono); font-size: 0.82rem; color: var(--text-muted);" id="drawer-issue-key">KEY-000</span>
      <button class="btn-secondary" id="btn-close-drawer" style="padding: 0.2rem 0.5rem;">✕</button>
    </div>
    <div class="drawer-body">
      <input type="text" id="drawer-title" class="form-input" style="font-size: 1.1rem; font-weight: 600; background: transparent; border-color: transparent; padding-left: 0;">
      
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; background: var(--bg-surface); padding: 1rem; border-radius: var(--radius-md); border: 1px solid var(--border-subtle);">
        <div>
          <span class="form-label" style="display: block; margin-bottom: 0.25rem;">Status</span>
          <select id="drawer-status" class="filter-select" style="width: 100%;">
            <option value="backlog">Backlog</option>
            <option value="todo">Todo</option>
            <option value="in_progress">In Progress</option>
            <option value="done">Done</option>
          </select>
        </div>
        <div>
          <span class="form-label" style="display: block; margin-bottom: 0.25rem;">Priority</span>
          <select id="drawer-priority" class="filter-select" style="width: 100%;">
            <option value="urgent">Urgent</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea id="drawer-description" class="form-textarea" rows="6"></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Activity Timeline</label>
        <div id="drawer-activity-list" style="display: flex; flex-direction: column; gap: 0.5rem; font-size: 0.78rem; color: var(--text-muted);">
          <!-- Activity entries -->
        </div>
      </div>
    </div>
    <div class="drawer-footer">
      <button class="btn-secondary" id="btn-delete-issue" style="color: #ef4444; border-color: rgba(239, 68, 68, 0.2);">Delete Issue</button>
      <button class="btn-primary" id="btn-save-drawer">Save Changes</button>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
